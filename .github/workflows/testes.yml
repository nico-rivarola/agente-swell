# CI: corre los tests en cada push y pull request.
# ¿Por qué? Si un cambio rompe una regla calibrada, GitHub lo marca en rojo
# antes de que el agente mande un reporte equivocado a la mañana.
name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
